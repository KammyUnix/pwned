name: Pwned

options:
  bundleIdPrefix: by.thekammy
  deploymentTarget:
    iOS: "26.3"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.3"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pwned
    # Without a launch screen, iOS runs the app letterboxed in a small 2:3 window
    # with empty bars above and below. This key makes it use the whole screen.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # The Info tab reads these back from the bundle, so this is the one place
    # the version and build are set.
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pwned:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Components
      - path: Core
      - path: Features
      - path: Models
      - path: Persistence
      - path: Resources
      - path: Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.thekammy.pwned
        PRODUCT_NAME: Pwned
        CODE_SIGNING_ALLOWED: NO
        # App icon: Resources/Assets.xcassets/AppIcon.appiconset (drawn by Tools/generate_icon.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons offered under Settings > Appearance > App Icon.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconGraphite AppIconSilver"

  PwnedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pwned
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.thekammy.pwned.tests
        PRODUCT_NAME: PwnedTests
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pwned.app/Pwned"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PwnedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pwned
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.thekammy.pwned.uitests
        PRODUCT_NAME: PwnedUITests
        CODE_SIGNING_ALLOWED: NO

schemes:
  Pwned:
    build:
      targets:
        Pwned: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PwnedTests
        - PwnedUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
