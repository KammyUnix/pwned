name: Pwned

options:
  bundleIdPrefix: by.thekammy
  deploymentTarget:
    iOS: "26.3"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.3"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pwned
    # The Info tab reads these back from the bundle, so this is the one place
    # the version and build are set.
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pwned:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Components
      - path: Core
      - path: Features
      - path: Models
      - path: Persistence
      - path: Resources
      - path: Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.thekammy.pwned
        PRODUCT_NAME: Pwned
        CODE_SIGNING_ALLOWED: NO
        # Temporary placeholder icon: Resources/Assets.xcassets/AppIcon.appiconset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PwnedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pwned
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.thekammy.pwned.tests
        PRODUCT_NAME: PwnedTests
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pwned.app/Pwned"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Pwned:
    build:
      targets:
        Pwned: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PwnedTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
