name: Test Pwned

# Runs the unit tests in the iOS Simulator. Kept separate from "Build Pwned" so a
# failing test never blocks producing the unsigned IPA, and a build problem is
# never hidden by a test report (or the other way round).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          best = None
          for runtime, devices in data["devices"].items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split("SimRuntime.iOS-")[-1].split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"], device["name"])
          print(best[1] if best else "")
          PY
          )
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator was found on this runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Pwned.xcodeproj \
            -scheme Pwned \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log

      - name: Summarize results
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            {
              echo "### Unit test results"
              echo '```json'
              xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --compact || true
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pwned-test-results
          path: |
            build/TestResults.xcresult
            build/test.log
          if-no-files-found: warn
          retention-days: 14
